services:
  db:
    image: postgres:16-alpine
    container_name: reimbursement-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reimbursement
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reimbursement"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  minio:
    image: alpine/minio:latest-release
    container_name: reimbursement-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/receipts &&
      mc anonymous set download myminio/receipts &&
      echo 'MinIO bucket receipts ready'"

  backend:
    build: ./backend
    container_name: reimbursement-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reimbursement?schema=public
      JWT_SECRET: jwt_secret_super_rahasia_2026_x9f2k8
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,https://feels-significant-replaced-forecast.trycloudflare.com}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: receipts
      MINIO_PUBLIC_URL: /storage
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      APP_URL: ${APP_URL}
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3001
        MINIO_URL: http://minio:9000
    container_name: reimbursement-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:3001
      MINIO_URL: http://minio:9000
    ports:
      - "3000:3000"

volumes:
  db_data:
  minio_data:
